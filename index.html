<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #d09eff;
  color: #222222;
}

h1 {
  color: #222222;
}

.noteikumi {
  background-color: #8093ff;
  color: #222222;
  padding: 12px;
}

.laukums {
  width: 360px;
  padding: 12px;
  border: 2px solid #aa94b8;
  background-color: #eaa4ff;
  box-sizing: border-box;
}

button {
  background-color: #7b2491;
  color: #ffffff;
  border-radius: 10px;
}
</style>
</head>
<body>
<h1>Tranzīts</h1>
<p>Jākustas cauri laikumam un jānošauda ienaidnieki.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Nošaudi ienaidnieku, lai iegūtu punktus.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="textures/vīriņš.png" alt="Spēles varonis" width="128">
  <p>Skaņas efekta nozīme spēlē:</p>
  <audio controls src="sound/click.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Nošaudi</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
